name: naviux_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
  intl: any
  firebase_core: any
  firebase_auth: any
  firebase_messaging: any
  google_sign_in: any
  flutter_local_notifications: ^17.2.3
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.0
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  video_player: ^2.8.2

  badges: any
  marquee: any
  flutter_animate: ^4.5.2
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  riverpod_annotation: ^2.6.1
  json_annotation: ^4.9.0
  cached_network_image: any
  flutter_widget_from_html: ^0.15.1
  # Actualizado según la sugerencia de la terminal
  g_recaptcha_v3: ^0.0.1
  crypto: ^3.0.7
  webview_flutter: ^4.13.1
  uuid: ^4.5.3
  encrypt: ^5.0.3
  pdf: ^3.12.0
  printing: ^5.14.3
  dart_des: ^1.0.2
  share_plus: ^10.1.4
  http: ^1.1.0
  path_provider: ^2.1.3
  syncfusion_flutter_pdfviewer: ^28.1.38
  syncfusion_flutter_pdf: ^28.1.38
  syncfusion_flutter_core: ^28.1.38

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: any
  riverpod_lint: any
  hive_generator: any
  flutter_launcher_icons: any
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_app.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/catalogo.pdf
    - assets/catalogo_test.pdf
    - assets/images/
    - assets/images/iconos/
    - assets/images/inicio/
    - assets/images/naviux/
    - assets/images/try_on/
    - assets/images/farmacia/
    - assets/images/sobre_nosotros/
    - assets/videos/

dependency_overrides:
  intl: ^0.20.2
